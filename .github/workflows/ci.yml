name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check (server)
        run: npx tsc --noEmit --project packages/server/tsconfig.json

      - name: Type check (SDK)
        run: npx tsc --noEmit --project packages/sdk/tsconfig.json

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build server
        run: npm run build --workspace=packages/server

      - name: Build SDK
        run: npm run build --workspace=packages/sdk
