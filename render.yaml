services:
  - type: web
    name: attest-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: node --import tsx packages/server/src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: attest-db
    plan: basic-256mb
    databaseName: attest
    postgresMajorVersion: "16"
